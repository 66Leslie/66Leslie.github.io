# 竞赛奖项记录 —— /competition/ 页面的唯一内容来源。
# 新增奖项：在对应年份 items 列表的最上面加一条（年份块按从新到旧排列）。
#
# month      卡片上显示的时间，如 "Jul."
# date       用于语义化标签，格式 YYYY-MM
# event      赛事名称（作为条目标题）
# prize      奖项名次，渲染成彩色徽章，如 "National First Prize"
# tier       徽章配色 + 统计归类：
#              world         世界赛名次，计入顶部 International
#              national      国家级奖项，计入顶部 National
#              provincial    省级奖项
#              participation 参赛/入围，不计入任何统计
# category   分类筛选，必须取自下面 categories 里的 id
# detail     一行补充说明，数组写多个片段，页面上用 · 连接；不需要就整行删掉
# links      可选，代码或成果链接：{ text: "Code", url: "..." }
# images     可选，卡片配图路径列表；多张图片每 3 秒轮播，系统要求减少动态效果时停用
#
# 顶部的 Awards / International / National 三个统计数字、以及每个筛选按钮上的计数，
# 都由页面按 tier 和 category 自动算出，不用手改。

